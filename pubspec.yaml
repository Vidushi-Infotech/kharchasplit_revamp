name: kharchasplit
description: "A Flutter expense-splitting app for groups and settlements."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1

  # Navigation
  go_router: ^17.1.0

  # UI & Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Formatting & Localization
  intl: ^0.20.2

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # HTTP Client
  dio: ^5.3.0

  # Utilities
  flutter_svg: ^2.0.0

  # Authentication
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.1

  # File & Image Handling
  image_picker: ^1.1.2

  # Permissions & Contacts
  flutter_contacts: ^1.1.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Data Modeling
  equatable: ^2.0.5
  uuid: ^4.4.0

  # Charts & Visualization
  fl_chart: ^1.2.0

  # Offline & Connectivity
  connectivity_plus: ^7.0.0

  # Sharing & Export
  share_plus: ^12.0.1
  path_provider: ^2.1.3
  pdf: ^3.11.1

  # Emoji Support
  emoji_picker_flutter: ^4.4.0

  # Image Processing & Compression
  flutter_image_compress: ^2.1.0
  image: ^4.0.0
  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
